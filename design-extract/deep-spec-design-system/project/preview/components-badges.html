<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .card { background: #171717; border: 1px solid rgba(255,255,255,0.10); border-radius: 22px; padding: 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .row + .row { border-top: 1px solid rgba(255,255,255,0.06); }
  .title { font-size: 13px; font-weight: 800; }
  .badge { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 9999px; font-size: 12px; font-weight: 800; border: 1px solid transparent; text-transform: capitalize; }
  .ok    { background: rgba(16,185,129,0.15); color: #6EE7B7; border-color: rgba(16,185,129,0.30); }
  .warn  { background: rgba(245,158,11,0.15); color: #FCD34D; border-color: rgba(245,158,11,0.30); }
  .danger{ background: rgba(239,68,68,0.10); color: #FCA5A5; border-color: rgba(239,68,68,0.30); }
  .meta { font-family: ui-monospace, monospace; font-size: 10.5px; color: rgba(255,255,255,0.42); }
</style></head>
<body>
  <div class="card">
    <div class="row">
      <div class="title">Brake fluid reservoir cap</div>
      <span class="badge ok">high</span>
    </div>
    <div class="row">
      <div class="title">Engine air filter</div>
      <span class="badge warn">medium</span>
    </div>
    <div class="row">
      <div class="title">Unidentified component</div>
      <span class="badge danger">low</span>
    </div>
  </div>
</body></html>
