<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .row { display: grid; grid-template-columns: 1fr 220px; gap: 14px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: ui-monospace, monospace; font-size: 10.5px; color: rgba(255,255,255,0.42); text-align: right; }
  .h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin: 0; }
  .h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; margin: 0; }
  .h3 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; margin: 0; }
</style></head>
<body>
  <div class="row">
    <h1 class="h1">Professional verification needed</h1>
    <div class="meta">H1 · 24 / 800 / -0.02em</div>
  </div>
  <div class="row">
    <h2 class="h2">Check another angle</h2>
    <div class="meta">H2 · 20 / 800 / -0.02em</div>
  </div>
  <div class="row">
    <h3 class="h3">Brake fluid reservoir cap</h3>
    <div class="meta">H3 · 16 / 800 / -0.02em</div>
  </div>
</body></html>
