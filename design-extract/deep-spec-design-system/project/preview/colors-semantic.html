<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { background: #171717; border-radius: 22px; padding: 16px; border: 1px solid rgba(255,255,255,0.10); }
  .swatch { height: 38px; border-radius: 12px; display: flex; align-items: center; padding: 0 12px; font-weight: 800; font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; }
  .name { font-weight: 800; }
  .hex { font-family: ui-monospace, monospace; color: rgba(255,255,255,0.62); }
  .tag { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.42); margin-bottom: 8px; }
  .ink { font-size: 12px; font-weight: 800; margin-top: 8px; }
  .ok    { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.30); color: #6EE7B7; }
  .warn  { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.30); color: #FCD34D; }
  .danger{ background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.30); color: #FCA5A5; }
</style></head>
<body>
  <div class="grid">
    <div class="card">
      <div class="tag">USEFUL MATCH</div>
      <div class="swatch ok">High confidence</div>
      <div class="row"><span class="name">#10B981</span><span class="hex">--ds-ok</span></div>
      <div class="ink" style="color:#6EE7B7;">Ink · #6EE7B7</div>
    </div>
    <div class="card">
      <div class="tag">CHECK / RETAKE</div>
      <div class="swatch warn">Professional needed</div>
      <div class="row"><span class="name">#F59E0B</span><span class="hex">--ds-warn</span></div>
      <div class="ink" style="color:#FCD34D;">Ink · #FCD34D</div>
    </div>
    <div class="card">
      <div class="tag">ERROR / DELETE</div>
      <div class="swatch danger">AI identification failed</div>
      <div class="row"><span class="name">#EF4444</span><span class="hex">--ds-danger</span></div>
      <div class="ink" style="color:#FCA5A5;">Ink · #FCA5A5</div>
    </div>
  </div>
</body></html>
