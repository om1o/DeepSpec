<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--ds-bg); font-family: var(--ds-font-sans); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .swatch { background: #171717; border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 14px; }
  .preview { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .tag { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.42); }
  .var { font-family: ui-monospace, monospace; font-size: 10px; color: rgba(255,255,255,0.62); margin-top: 2px; }
</style></head>
<body>
  <div class="grid">
    <div class="swatch">
      <div class="preview" style="color: #fff;">Aa — 100%</div>
      <div class="tag">FG-1</div><div class="var">#FFFFFF · headings</div>
    </div>
    <div class="swatch">
      <div class="preview" style="color: rgba(255,255,255,0.92);">Aa — 92%</div>
      <div class="tag">FG-2</div><div class="var">primary on dim</div>
    </div>
    <div class="swatch">
      <div class="preview" style="color: rgba(255,255,255,0.70);">Aa — 70%</div>
      <div class="tag">FG-4</div><div class="var">eyebrow / subhead</div>
    </div>
    <div class="swatch">
      <div class="preview" style="color: rgba(255,255,255,0.62);">Aa — 62%</div>
      <div class="tag">FG-5</div><div class="var">section caps</div>
    </div>
    <div class="swatch">
      <div class="preview" style="color: rgba(255,255,255,0.42);">Aa — 42%</div>
      <div class="tag">FG-6</div><div class="var">metadata</div>
    </div>
    <div class="swatch">
      <div class="preview" style="color: rgba(255,255,255,0.36);">Aa — 36%</div>
      <div class="tag">FG-7</div><div class="var">tertiary meta</div>
    </div>
    <div class="swatch">
      <div class="preview" style="color: rgba(255,255,255,0.32);">Aa — 32%</div>
      <div class="tag">FG-8</div><div class="var">placeholder</div>
    </div>
    <div class="swatch">
      <div class="preview" style="color: #A1A1AA;">Aa — body</div>
      <div class="tag">FG-MUTE</div><div class="var">#A1A1AA · paragraph</div>
    </div>
  </div>
</body></html>
