<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .col { display: grid; grid-template-columns: 1fr 220px; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .col:last-child { border-bottom: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .meta { font-family: ui-monospace, monospace; font-size: 10.5px; color: rgba(255,255,255,0.42); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 9999px; font-size: 14px; font-weight: 700; border: 0; }
  .btn--primary { background: #fff; color: #0A0A0A; box-shadow: 0 12px 40px rgba(255,255,255,0.18); }
  .btn--ghost { background: rgba(255,255,255,0.10); color: #fff; backdrop-filter: blur(12px); }
  .btn--danger { background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.30); color: #FCA5A5; }
  .btn--disabled { background: #fff; color: #0A0A0A; opacity: 0.45; pointer-events: none; }
  .btn--lg { height: 56px; padding: 0 24px; font-size: 16px; min-height: 56px; }
  .btn--xs { min-height: 36px; padding: 0 14px; font-size: 12px; font-weight: 800; }
</style></head>
<body>
  <div class="col">
    <div class="row">
      <button class="btn btn--lg btn--primary">Identify</button>
      <button class="btn btn--primary">Try another scan</button>
    </div>
    <div class="meta">PRIMARY · white pill + white-glow</div>
  </div>
  <div class="col">
    <div class="row">
      <button class="btn btn--ghost">Helpful</button>
      <button class="btn btn--ghost">Wrong</button>
      <button class="btn btn--xs btn--ghost">Saved</button>
    </div>
    <div class="meta">GHOST · white/10 + blur</div>
  </div>
  <div class="col">
    <div class="row">
      <button class="btn btn--danger">Delete saved scan</button>
    </div>
    <div class="meta">DANGER · soft red, line border</div>
  </div>
  <div class="col">
    <div class="row">
      <button class="btn btn--disabled">Identify</button>
    </div>
    <div class="meta">DISABLED · opacity 0.45</div>
  </div>
</body></html>
