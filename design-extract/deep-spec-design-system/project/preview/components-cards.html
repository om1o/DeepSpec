<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .card { background: #171717; border: 1px solid rgba(255,255,255,0.10); border-radius: 24px; padding: 18px; }
  .card-warn { border-color: rgba(245,158,11,0.30); background: rgba(245,158,11,0.10); }
  .eyebrow { font-size: 12px; font-weight: 800; color: #FACC15; }
  .eyebrow-warn { color: #FACC15; }
  .h { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
  .body { font-size: 13px; line-height: 1.55; color: #A1A1AA; margin-top: 10px; }
  .nested { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 10px; margin-top: 12px; }
  .nestlab { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.42); }
  .nestval { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.84); margin-top: 2px; }
</style></head>
<body>
  <div class="grid">
    <div class="card">
      <div class="eyebrow">AI identification</div>
      <h2 class="h">Brake fluid reservoir cap</h2>
      <p class="body">The image has enough visual evidence for a useful consumer-level explanation.</p>
      <div class="nested">
        <div class="nestlab">Photo quality</div>
        <div class="nestval">Good</div>
      </div>
    </div>
    <div class="card card-warn">
      <div class="eyebrow eyebrow-warn">Safety-critical</div>
      <h2 class="h">Professional verification needed</h2>
      <p class="body" style="color: rgba(255,255,255,0.82);">Verify this with a mechanic before driving or attempting repair.</p>
    </div>
  </div>
</body></html>
