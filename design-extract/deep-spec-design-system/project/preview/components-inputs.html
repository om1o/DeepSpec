<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: block; }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.42); }
  .input { display: block; margin-top: 8px; width: 100%; height: 48px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); background: rgba(0,0,0,0.28); color: #fff; padding: 0 12px; font-size: 14px; outline: none; font-family: inherit; }
  .input--focus { border-color: rgba(250,204,21,0.50); }
  .textarea { display: block; margin-top: 8px; width: 100%; min-height: 80px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); background: rgba(0,0,0,0.28); color: #fff; padding: 12px; font-size: 14px; line-height: 1.55; resize: none; font-family: inherit; }
  ::placeholder { color: rgba(255,255,255,0.32); }
  .select { display: block; margin-top: 8px; width: 100%; height: 48px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); background: rgba(0,0,0,0.28); color: #fff; padding: 0 12px; font-size: 14px; appearance: none; -webkit-appearance: none; font-family: inherit;
    background-image: linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.62) 50%), linear-gradient(135deg, rgba(255,255,255,0.62) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
</style></head>
<body>
  <div class="grid">
    <label class="field">
      <span class="lbl">Email</span>
      <input class="input" type="email" placeholder="you@example.com" />
    </label>
    <label class="field">
      <span class="lbl">Focus state</span>
      <input class="input input--focus" type="text" value="hello@deepspec.app" />
    </label>
    <label class="field" style="grid-column: 1 / -1;">
      <span class="lbl">Private notes</span>
      <textarea class="textarea" placeholder="Optional: where the part was, symptoms, what you checked next"></textarea>
    </label>
    <label class="field" style="grid-column: 1 / -1;">
      <span class="lbl">I am a</span>
      <select class="select"><option>Car owner</option></select>
    </label>
  </div>
</body></html>
