<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--ds-bg); font-family: var(--ds-font-sans); }
  .wrap { display: grid; grid-template-columns: 172px 1fr; gap: 24px; align-items: center; }
  .icon-box { width: 172px; height: 172px; border-radius: 38px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05); }
  .icon-box img { display: block; width: 100%; height: 100%; }
  .meta { color: var(--ds-fg-1); }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.18em; color: var(--ds-accent); text-transform: uppercase; }
  .wordmark { margin-top: 6px; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
  .desc { margin-top: 10px; font-size: 13px; line-height: 1.5; color: var(--ds-fg-mute); max-width: 380px; }
  .files { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .file { font-family: var(--ds-font-mono); font-size: 11px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: var(--ds-fg-3); }
</style></head>
<body>
  <div class="wrap">
    <div class="icon-box"><img src="../assets/deepspec-app-icon.png" alt="Deep Spec app icon" /></div>
    <div class="meta">
      <div class="eyebrow">Deep Spec · app mark</div>
      <div class="wordmark">DEEP SPEC</div>
      <div class="desc">A metallic hex-bolt frame around a glossy camera lens, set inside a cyan focus-bracket reticle. The reticle motif extends into the UI as the yellow scanner reticle.</div>
      <div class="files">
        <span class="file">deepspec-app-icon.png</span>
        <span class="file">icon-512.png</span>
        <span class="file">icon-192.png</span>
      </div>
    </div>
  </div>
</body></html>
