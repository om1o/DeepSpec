<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .row { display: grid; grid-template-columns: 60px 1fr 200px; align-items: center; gap: 14px; padding: 6px 0; }
  .name { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; }
  .bar { height: 16px; background: #FACC15; border-radius: 4px; }
  .meta { font-family: ui-monospace, monospace; font-size: 10.5px; color: rgba(255,255,255,0.62); }
</style></head>
<body>
  <div class="row"><div class="name">4</div><div><div class="bar" style="width: 4px;"></div></div><div class="meta">--ds-space-1 · hairline</div></div>
  <div class="row"><div class="name">8</div><div><div class="bar" style="width: 8px;"></div></div><div class="meta">--ds-space-2 · icon gap</div></div>
  <div class="row"><div class="name">12</div><div><div class="bar" style="width: 12px;"></div></div><div class="meta">--ds-space-3 · row gap</div></div>
  <div class="row"><div class="name">16</div><div><div class="bar" style="width: 16px;"></div></div><div class="meta">--ds-space-4 · section gap / gutter</div></div>
  <div class="row"><div class="name">20</div><div><div class="bar" style="width: 20px;"></div></div><div class="meta">--ds-space-5 · ★ card padding</div></div>
  <div class="row"><div class="name">24</div><div><div class="bar" style="width: 24px;"></div></div><div class="meta">--ds-space-6 · card top inset</div></div>
  <div class="row"><div class="name">32</div><div><div class="bar" style="width: 32px;"></div></div><div class="meta">--ds-space-8 · screen padding · max</div></div>
</body></html>
