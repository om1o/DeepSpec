<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .wm-lg { font-size: 28px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; }
  .wm-md { margin-top: 14px; font-size: 16px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.70); }
  .wm-sm { margin-top: 12px; font-size: 13px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.92); }
  .row { display: flex; gap: 24px; align-items: baseline; }
  .meta { color: rgba(255,255,255,0.42); font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; }
  .div { border-top: 1px solid rgba(255,255,255,0.08); margin: 14px 0; }
</style></head>
<body>
  <div class="row"><span class="wm-lg">DEEP SPEC</span><span class="meta">28 / 800 / 0.18em</span></div>
  <div class="div"></div>
  <div class="row"><span class="wm-sm">DEEP SPEC</span><span class="meta">13 / 800 / 0.18em — header use</span></div>
  <div class="div"></div>
  <div class="row"><span class="wm-md">DEEP SPEC</span><span class="meta">16 / 800 / 0.18em — fg-4 muted</span></div>
</body></html>
