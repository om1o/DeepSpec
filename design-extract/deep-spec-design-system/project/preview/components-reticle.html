<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .scene { position: relative; border-radius: 22px; overflow: hidden; background:
    radial-gradient(circle at 30% 30%, #2a2a28 0%, #14140f 38%, #0a0a0a 70%);
    height: 240px;
    border: 1px solid rgba(255,255,255,0.10);
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }
  .stage { position: relative; height: 100%; }
  .divider { position: absolute; top: 50%; left: 50%; width: 1px; height: 60%; background: rgba(255,255,255,0.08); transform: translate(-50%, -50%); z-index: 5; }
  .reticle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60%; aspect-ratio: 4/3; }
  .reticle.inactive .dash { opacity: 0; }
  .reticle.inactive .corner { opacity: 0; }
  .dash { position: absolute; inset: 0; border-radius: 18px; border: 1.5px dashed rgba(250,204,21,0.45); box-shadow: 0 0 20px rgba(250,204,21,0.30); transition: opacity 300ms; }
  .corner { position: absolute; width: 24px; height: 24px; border-color: rgba(250,204,21,0.88); filter: drop-shadow(0 0 8px rgba(250,204,21,0.42)); transition: opacity 300ms; }
  .tl { top: 0; left: 0; border-top: 3px solid; border-left: 3px solid; border-top-left-radius: 18px; }
  .tr { top: 0; right: 0; border-top: 3px solid; border-right: 3px solid; border-top-right-radius: 18px; }
  .bl { bottom: 0; left: 0; border-bottom: 3px solid; border-left: 3px solid; border-bottom-left-radius: 18px; }
  .br { right: 0; bottom: 0; border-right: 3px solid; border-bottom: 3px solid; border-bottom-right-radius: 18px; }
  .lbl { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.62); }
</style></head>
<body>
  <div class="scene">
    <div class="stage">
      <div class="reticle inactive">
        <div class="dash"></div>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
      <div class="lbl">Not steady</div>
    </div>
    <div class="divider"></div>
    <div class="stage">
      <div class="reticle">
        <div class="dash"></div>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
      <div class="lbl">Steady · ready</div>
    </div>
  </div>
</body></html>
