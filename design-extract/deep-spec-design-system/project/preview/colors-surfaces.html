<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatch { border-radius: 18px; padding: 14px; border: 1px solid rgba(255,255,255,0.10); min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; }
  .tag { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.42); }
  .name { font-size: 13px; font-weight: 800; color: #fff; }
  .hex { font-family: ui-monospace, monospace; font-size: 10.5px; color: rgba(255,255,255,0.62); }
</style></head>
<body>
  <div class="grid">
    <div class="swatch" style="background: #0A0A0A;">
      <div class="tag">PAGE</div>
      <div><div class="name">--ds-bg</div><div class="hex">#0A0A0A</div></div>
    </div>
    <div class="swatch" style="background: #171717;">
      <div class="tag">CARD</div>
      <div><div class="name">--ds-surface-1</div><div class="hex">#171717</div></div>
    </div>
    <div class="swatch" style="background: #171717;">
      <div class="tag">NESTED</div>
      <div style="background: rgba(255,255,255,0.04); border-radius: 12px; padding: 8px;">
        <div class="name">--ds-surface-2</div><div class="hex">white / 4%</div>
      </div>
    </div>
    <div class="swatch" style="background: #171717;">
      <div class="tag">INPUT FIELD</div>
      <div style="background: rgba(0,0,0,0.28); border-radius: 12px; padding: 8px; border: 1px solid rgba(255,255,255,0.10);">
        <div class="name">--ds-surface-input</div><div class="hex">black / 28%</div>
      </div>
    </div>
  </div>
</body></html>
