<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .item { background: #171717; border: 1px solid rgba(255,255,255,0.10); padding: 10px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 72px; background: linear-gradient(135deg, rgba(250,204,21,0.20), rgba(59,130,246,0.20)); border: 1px solid rgba(255,255,255,0.20); }
  .name { font-size: 11px; font-weight: 800; }
  .val  { font-family: ui-monospace, monospace; font-size: 10px; color: rgba(255,255,255,0.62); }
  .use  { font-size: 9.5px; color: rgba(255,255,255,0.42); text-align: center; }
</style></head>
<body>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:18px;"></div><div class="name">SM · 18px</div><div class="val">--ds-radius-sm</div><div class="use">reticle / thumb</div></div>
    <div class="item"><div class="box" style="border-radius:20px;"></div><div class="name">MD · 20px</div><div class="val">--ds-radius-md</div><div class="use">nested cards</div></div>
    <div class="item"><div class="box" style="border-radius:22px;"></div><div class="name">LG · 22px</div><div class="val">--ds-radius-lg</div><div class="use">chat bubble</div></div>
    <div class="item"><div class="box" style="border-radius:24px;"></div><div class="name">XL · 24px</div><div class="val">--ds-radius-xl</div><div class="use">★ primary card</div></div>
    <div class="item"><div class="box" style="border-radius:28px;"></div><div class="name">2XL · 28px</div><div class="val">--ds-radius-2xl</div><div class="use">modal</div></div>
    <div class="item"><div class="box" style="border-radius:9999px;"></div><div class="name">PILL · ∞</div><div class="val">9999px</div><div class="use">★ button / chip</div></div>
  </div>
</body></html>
