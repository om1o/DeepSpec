<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .frame { background: #171717; border: 1px solid rgba(255,255,255,0.10); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .user { align-self: flex-end; max-width: 84%; background: #fff; color: #0A0A0A; padding: 12px 16px; border-radius: 22px; font-size: 13px; line-height: 1.55; font-weight: 500; }
  .assistant { align-self: flex-start; max-width: 90%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: rgba(255,255,255,0.86); padding: 12px 16px; border-radius: 22px; font-size: 13px; line-height: 1.55; }
  .typing { align-self: flex-start; max-width: 90%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: rgba(255,255,255,0.60); padding: 12px 16px; border-radius: 22px; font-size: 13px; font-weight: 600; }
</style></head>
<body>
  <div class="frame">
    <div class="user">Is this leak serious?</div>
    <div class="assistant">The reservoir looks low but not empty. Top it off, then check again after 50 miles — if it drops, get the system inspected before driving further.</div>
    <div class="user">What fluid do I use?</div>
    <div class="typing">Thinking...</div>
  </div>
</body></html>
