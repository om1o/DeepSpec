<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--ds-bg); font-family: var(--ds-font-sans); color: #fff; }
  .stage {
    position: relative; height: 200px; border-radius: 22px; overflow: hidden;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.52), rgba(0,0,0,0) 35%),
      radial-gradient(circle at 50% 70%, #2a2a28 0%, #14140f 50%, #0a0a0a 100%);
    border: 1px solid rgba(255,255,255,0.10);
  }
  .header { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; }
  .wm { font-size: 13px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.92); }
  .pills { display: flex; gap: 8px; }
  .pill-btn { padding: 8px 14px; border-radius: 9999px; background: rgba(0,0,0,0.35); backdrop-filter: blur(12px); color: rgba(255,255,255,0.82); font-size: 12px; font-weight: 800; }
  .sub { position: absolute; left: 16px; top: 52px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.68); }
  .cta { position: absolute; bottom: 18px; left: 18px; right: 18px; height: 52px; border-radius: 9999px; background: #fff; color: #0A0A0A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-shadow: 0 12px 40px rgba(255,255,255,0.18); }
</style></head>
<body>
  <div class="stage">
    <div class="header">
      <span class="wm">DEEP SPEC</span>
      <div class="pills">
        <span class="pill-btn">Join</span>
        <span class="pill-btn">Saved</span>
      </div>
    </div>
    <div class="sub">Point at a car part and hold steady</div>
    <div class="cta">Identify</div>
  </div>
</body></html>
