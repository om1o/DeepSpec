services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepspec
      POSTGRES_PASSWORD: deepspec
      POSTGRES_DB: deepspec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepspec -d deepspec"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: deepspec
      MINIO_ROOT_PASSWORD: deepspec_secret_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 deepspec deepspec_secret_change_me;
      mc mb --ignore-existing local/deepspec-artifacts;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
