name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "reliability-fixes"
      - "phase2-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, tests, and build
        run: npm run check

  auth:
    name: Auth verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Supabase auth providers when configuration is available
        env:
          DEEPSPEC_AUTH_TEST_EMAIL: ${{ secrets.DEEPSPEC_AUTH_TEST_EMAIL }}
          DEEPSPEC_AUTH_TEST_EMAIL_CODE: ${{ secrets.DEEPSPEC_AUTH_TEST_EMAIL_CODE }}
          DEEPSPEC_AUTH_TEST_PASSWORD: ${{ secrets.DEEPSPEC_AUTH_TEST_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Supabase public settings are not configured; auth verifier did not run."
            {
              echo "### Supabase auth"
              echo ""
              echo "Not verified: repository variables or secrets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY are missing. See docs/CI_SETUP.md."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_BASE_REF" = "main" ] || [[ "$branch" == codex/production-readiness-release* ]]; then
              echo "Production-readiness branches and main must prove Supabase auth provider readiness."
              exit 1
            fi

            exit 0
          fi

          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_BASE_REF" = "main" ] || [[ "$branch" == codex/production-readiness-release* ]]; then
            npm run verify:auth -- --require-password
          else
            npm run verify:auth
          fi

  cloud:
    name: Cloud isolation verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Supabase cloud sync when configuration is available
        env:
          DEEPSPEC_AUTH_TEST_EMAIL: ${{ secrets.DEEPSPEC_AUTH_TEST_EMAIL }}
          DEEPSPEC_AUTH_TEST_PASSWORD: ${{ secrets.DEEPSPEC_AUTH_TEST_PASSWORD }}
          DEEPSPEC_AUTH_TEST_OTHER_EMAIL: ${{ secrets.DEEPSPEC_AUTH_TEST_OTHER_EMAIL }}
          DEEPSPEC_AUTH_TEST_OTHER_PASSWORD: ${{ secrets.DEEPSPEC_AUTH_TEST_OTHER_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$DEEPSPEC_AUTH_TEST_EMAIL" ] || [ -z "$DEEPSPEC_AUTH_TEST_PASSWORD" ] || [ -z "$DEEPSPEC_AUTH_TEST_OTHER_EMAIL" ] || [ -z "$DEEPSPEC_AUTH_TEST_OTHER_PASSWORD" ]; then
            echo "::warning::Supabase settings or confirmed QA credentials are not configured; cloud sync verifier did not run."
            {
              echo "### Supabase cloud sync"
              echo ""
              echo "Not verified: Supabase public settings and two distinct confirmed QA accounts are required. See docs/CI_SETUP.md."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_BASE_REF" = "main" ] || [[ "$branch" == codex/production-readiness-release* ]]; then
              echo "Production-readiness branches and main must prove Supabase cloud sync."
              exit 1
            fi

            exit 0
          fi

          npm run verify:supabase

  browser:
    name: Browser smoke (synthetic data)
    # Playwright 1.60 supports Ubuntu 24.04, but not the 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            artifacts/browser-smoke/report.json
            artifacts/browser-smoke/*.png
          if-no-files-found: warn
