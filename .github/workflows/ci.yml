name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "reliability-fixes"
      - "phase2-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, tests, and build
        run: npm run check

      - name: Verify Supabase cloud sync when secrets are configured
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Supabase public secrets are not configured; cloud sync verifier did not run."
            {
              echo "### Supabase cloud sync"
              echo ""
              echo "Not verified: repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY are missing."
            } >> "$GITHUB_STEP_SUMMARY"

            changed_files="$(git diff --name-only HEAD^1 HEAD || true)"
            if echo "$changed_files" | grep -E '^(supabase/|scripts/(verify-supabase-sync|print-supabase-).*\.mjs|src/services/cloudSync|docs/PHASE_8_SUPABASE_VALIDATION\.md)' > /dev/null; then
              echo "This PR changes Supabase/cloud-sync files, so it must prove cloud sync with repository secrets configured."
              exit 1
            fi

            if [ "$GITHUB_REF_NAME" = "main" ] || [[ "$branch" == codex/production-readiness-release* ]]; then
              echo "Production-readiness branches and main must prove Supabase cloud sync."
              exit 1
            fi

            exit 0
          fi

          npm run verify:supabase
