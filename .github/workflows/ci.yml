name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "reliability-fixes"
      - "phase2-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, tests, and build
        run: npm run check

      - name: Verify Supabase auth providers when secrets are configured
        env:
          DEEPSPEC_AUTH_TEST_EMAIL: ${{ secrets.DEEPSPEC_AUTH_TEST_EMAIL }}
          DEEPSPEC_AUTH_TEST_EMAIL_CODE: ${{ secrets.DEEPSPEC_AUTH_TEST_EMAIL_CODE }}
          DEEPSPEC_AUTH_TEST_PASSWORD: ${{ secrets.DEEPSPEC_AUTH_TEST_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Supabase public secrets are not configured; auth verifier did not run."
            {
              echo "### Supabase auth"
              echo ""
              echo "Not verified: repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY are missing."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$GITHUB_REF_NAME" = "main" ] || [[ "$branch" == codex/production-readiness-release* ]]; then
              echo "Production-readiness branches and main must prove Supabase auth provider readiness."
              exit 1
            fi

            exit 0
          fi

          npm run verify:auth

      - name: Verify Supabase cloud sync when secrets are configured
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Supabase public secrets are not configured; cloud sync verifier did not run."
            {
              echo "### Supabase cloud sync"
              echo ""
              echo "Not verified: repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY are missing."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$GITHUB_REF_NAME" = "main" ] || [[ "$branch" == codex/production-readiness-release* ]]; then
              echo "Production-readiness branches and main must prove Supabase cloud sync."
              exit 1
            fi

            exit 0
          fi

          npm run verify:supabase
